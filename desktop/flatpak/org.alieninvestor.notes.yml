app-id: org.alieninvestor.notes
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: alien-notes
separate-locales: false
# Bewusst KEIN --share=network und KEIN --filesystem: Dateien nur über das Portal (Dialog), Netz gibt es im Käfig nicht.
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - name: alien-notes
    buildsystem: simple
    build-options:   # Electron-Binaries unverändert lassen (gepinnter Hash + Fuses), kein Debug-Ableger
      no-debuginfo: true
      strip: false
    sources:
      - type: dir
        path: ../build/electron
        dest: electron
      - type: file
        path: alien-notes.sh
      - type: file
        path: org.alieninvestor.notes.desktop
      - type: file
        path: ../../icon.svg
    build-commands:
      - mkdir -p /app/main && cp -a electron/. /app/main/
      - install -Dm755 alien-notes.sh /app/bin/alien-notes
      - install -Dm644 org.alieninvestor.notes.desktop /app/share/applications/org.alieninvestor.notes.desktop
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/org.alieninvestor.notes.svg
